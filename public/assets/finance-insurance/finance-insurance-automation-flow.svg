<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Finance automation flow mockup</title>
  <desc id="desc">A visual workflow for payment reminders, secure links and advisor handoff.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF7EE"/><stop offset="1" stop-color="#E7F6EF"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#06402F" flood-opacity="0.14"/></filter></defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <g opacity="0.14" stroke="#06402F"><path d="M0 164h1536M0 328h1536M0 492h1536M0 656h1536M0 820h1536"/><path d="M192 0v1024M384 0v1024M576 0v1024M768 0v1024M960 0v1024M1152 0v1024M1344 0v1024"/></g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="156" y="134" width="1224" height="756" rx="44" fill="#fff"/>
