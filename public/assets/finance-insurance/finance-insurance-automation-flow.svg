    <rect x="226" y="298" width="260" height="132" rx="26" fill="#06402F"/><text x="260" y="352" font-size="21" font-weight="800" fill="#fff">Event trigger</text><text x="260" y="386" font-size="17" fill="#CBEFDA">Policy expires in 7 days</text>
    <path d="M486 364h128" stroke="#0C7C59" stroke-width="8" stroke-linecap="round"/><path d="M604 346l32 18-32 18" fill="#0C7C59"/>
    <rect x="636" y="286" width="300" height="156" rx="26" fill="#ECF7EF"/><text x="674" y="340" font-size="21" font-weight="800" fill="#06402F">Send reminder</text><text x="674" y="374" font-size="17" fill="#66756F">Template message</text><rect x="674" y="396" width="148" height="30" rx="15" fill="#0C7C59"/><text x="694" y="417" font-size="13" font-weight="800" fill="#fff">Secure link</text>
    <path d="M936 364h128" stroke="#0C7C59" stroke-width="8" stroke-linecap="round"/><path d="M1054 346l32 18-32 18" fill="#0C7C59"/>
    <rect x="1086" y="286" width="224" height="156" rx="26" fill="#FFF6E7"/><text x="1122" y="340" font-size="21" font-weight="800" fill="#06402F">Client action</text><text x="1122" y="374" font-size="17" fill="#76522C">Renew or reply</text>
    <path d="M1198 442v92M1198 534H768M768 534v72" stroke="#0C7C59" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M750 596l18 32 18-32" fill="#0C7C59"/>
