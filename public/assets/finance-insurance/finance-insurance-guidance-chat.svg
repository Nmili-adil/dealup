<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Client guidance chat mockup</title>
  <desc id="desc">A finance client asks about eligibility and receives clear next steps.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EDF8F1"/><stop offset="1" stop-color="#FAF3E3"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#06402F" flood-opacity="0.16"/></filter></defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <circle cx="1268" cy="174" r="214" fill="#0C7C59" opacity="0.1"/>
  <g filter="url(#shadow)">
    <rect x="230" y="112" width="1076" height="800" rx="48" fill="#fff"/>
    <rect x="230" y="112" width="1076" height="104" rx="48" fill="#06402F"/><text x="296" y="176" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">Loan enquiry flow</text><text x="1066" y="176" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700" fill="#93E0BE">Approved content</text>
    <rect x="300" y="280" width="436" height="112" rx="28" fill="#F3F7F4"/><text x="334" y="326" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#06402F">I need a business loan.</text><text x="334" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#66756F">What documents do I need?</text>
    <rect x="560" y="430" width="656" height="154" rx="28" fill="#DCF7E8"/><text x="594" y="476" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#06402F">Here are the next steps</text><text x="594" y="514" font-family="Inter,Arial,sans-serif" font-size="18" fill="#28584A">1. Choose your turnover range</text><text x="594" y="548" font-family="Inter,Arial,sans-serif" font-size="18" fill="#28584A">2. Upload documents through a secure link</text>
    <rect x="300" y="626" width="454" height="92" rx="28" fill="#F3F7F4"/><text x="334" y="678" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#06402F">Can I speak to an advisor?</text>
    <rect x="560" y="750" width="570" height="92" rx="28" fill="#FFF6E7"/><text x="594" y="790" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" fill="#06402F">Advisor handoff ready</text><text x="594" y="820" font-family="Inter,Arial,sans-serif" font-size="17" fill="#76522C">All answers and consent attached</text>
  </g>
</svg>
