<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Shared finance inbox mockup</title>
  <desc id="desc">A shared team inbox showing client profile, conversation history and advisor assignment.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EAF7EF"/><stop offset="1" stop-color="#F8F1DF"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="145%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#06402F" flood-opacity="0.16"/></filter></defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="132" y="124" width="1272" height="776" rx="42" fill="#fff"/>
    <rect x="132" y="124" width="306" height="776" rx="42" fill="#06402F"/><text x="184" y="198" font-size="28" font-weight="800" fill="#fff">Finance inbox</text>
    <rect x="178" y="262" width="214" height="84" rx="22" fill="#0C7C59"/><text x="210" y="300" font-size="17" font-weight="800" fill="#fff">Loan enquiry</text><text x="210" y="326" font-size="14" fill="#CBEFDA">Assigned to Sara</text>
    <rect x="178" y="378" width="214" height="84" rx="22" fill="#0B513C"/><text x="210" y="416" font-size="17" font-weight="800" fill="#fff">Claim update</text><text x="210" y="442" font-size="14" fill="#CBEFDA">High priority</text>
    <rect x="178" y="494" width="214" height="84" rx="22" fill="#0B513C"/><text x="210" y="532" font-size="17" font-weight="800" fill="#fff">Renewal reply</text><text x="210" y="558" font-size="14" fill="#CBEFDA">Arabic</text>
    <rect x="488" y="188" width="528" height="646" rx="30" fill="#F8FAF6"/><text x="538" y="250" font-size="26" font-weight="800" fill="#06402F">Client conversation</text>
    <rect x="538" y="304" width="338" height="82" rx="22" fill="#fff"/><text x="566" y="354" font-size="18" font-weight="700" fill="#06402F">I uploaded the missing document.</text>
    <rect x="620" y="426" width="330" height="96" rx="22" fill="#DCF7E8"/><text x="650" y="466" font-size="18" font-weight="800" fill="#06402F">Thanks. We received it.</text><text x="650" y="496" font-size="15" fill="#28584A">Your advisor will review shortly.</text>
    <rect x="538" y="564" width="394" height="100" rx="22" fill="#fff"/><text x="566" y="604" font-size="18" font-weight="700" fill="#06402F">Can you confirm the next step?</text><text x="566" y="634" font-size="15" fill="#66756F">Client asks for human help</text>
    <rect x="1048" y="188" width="296" height="646" rx="30" fill="#fff" stroke="#DCE8E1"/><text x="1084" y="250" font-size="24" font-weight="800" fill="#06402F">Client profile</text>
    <text x="1084" y="320" font-size="15" font-weight="800" fill="#66756F">PRODUCT</text><text x="1084" y="350" font-size="20" font-weight="800" fill="#06402F">Business loan</text>
    <text x="1084" y="414" font-size="15" font-weight="800" fill="#66756F">STAGE</text><text x="1084" y="444" font-size="20" font-weight="800" fill="#06402F">Documents review</text>
    <text x="1084" y="508" font-size="15" font-weight="800" fill="#66756F">CONSENT</text><text x="1084" y="538" font-size="20" font-weight="800" fill="#0C7C59">Opted in</text>
    <rect x="1084" y="612" width="190" height="46" rx="23" fill="#06402F"/><text x="1118" y="642" font-size="16" font-weight="800" fill="#fff">Assign advisor</text>
  </g>
</svg>
