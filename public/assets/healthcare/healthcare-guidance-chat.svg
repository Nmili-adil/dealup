<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#06402f" flood-opacity=".16"/></filter></defs>
  <rect width="1536" height="1024" rx="64" fill="#eef8f4"/>
  <circle cx="1300" cy="170" r="260" fill="#25d366" opacity=".12"/>
  <circle cx="230" cy="870" r="250" fill="#e7b873" opacity=".18"/>
  <g filter="url(#s)">
    <rect x="148" y="126" width="1240" height="772" rx="44" fill="#fff"/>
    <rect x="148" y="126" width="1240" height="92" rx="44" fill="#06402f"/>
    <rect x="148" y="176" width="1240" height="42" fill="#06402f"/>
    <text x="210" y="184" font-family="Arial" font-size="26" font-weight="800" fill="#fff">Patient guidance</text>
    <text x="210" y="270" font-family="Arial" font-size="17" font-weight="700" fill="#047857">Live WhatsApp conversation</text>
    <rect x="210" y="314" width="442" height="94" rx="28" fill="#dcfce7"/>
    <text x="246" y="350" font-family="Arial" font-size="18" fill="#06402f">Hello, I need a consultation.</text>
    <text x="246" y="380" font-family="Arial" font-size="18" fill="#06402f">What is available today?</text>
    <rect x="814" y="340" width="420" height="118" rx="28" fill="#f3f4f6"/>
    <text x="852" y="378" font-family="Arial" font-size="18" fill="#111827">We can help. Which service do</text>
    <text x="852" y="408" font-family="Arial" font-size="18" fill="#111827">you need and which language</text>
    <text x="852" y="438" font-family="Arial" font-size="18" fill="#111827">do you prefer?</text>
    <rect x="814" y="494" width="148" height="48" rx="24" fill="#06402f"/>
    <text x="858" y="525" font-family="Arial" font-size="16" font-weight="700" fill="#fff">Arabic</text>
    <rect x="980" y="494" width="146" height="48" rx="24" fill="#eef8f4"/>
    <text x="1020" y="525" font-family="Arial" font-size="16" font-weight="700" fill="#06402f">French</text>
    <rect x="1144" y="494" width="136" height="48" rx="24" fill="#eef8f4"/>
    <text x="1180" y="525" font-family="Arial" font-size="16" font-weight="700" fill="#06402f">English</text>
    <rect x="210" y="604" width="458" height="98" rx="28" fill="#dcfce7"/>
    <text x="246" y="644" font-family="Arial" font-size="18" fill="#06402f">General consultation, Arabic,</text>
    <text x="246" y="674" font-family="Arial" font-size="18" fill="#06402f">and I prefer afternoon.</text>
    <rect x="814" y="652" width="374" height="94" rx="28" fill="#f3f4f6"/>
    <text x="852" y="690" font-family="Arial" font-size="18" fill="#111827">Great. We have Friday 15:00.</text>
    <text x="852" y="720" font-family="Arial" font-size="18" fill="#111827">Would you like to confirm?</text>
    <rect x="210" y="792" width="1116" height="54" rx="27" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="250" y="826" font-family="Arial" font-size="16" fill="#6b7280">Collected: service, language, preferred time. Sensitive details stay out of the chat.</text>
